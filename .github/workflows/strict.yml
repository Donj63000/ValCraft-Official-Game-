name: ValCraft Strict

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  strict:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install deterministic build and visual tooling
        run: >-
          python -m pip install
          --requirement tools/requirements-build.txt
          --requirement tools/requirements-visual.txt

      - name: Setup MSYS2 toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Export MSYS2 MinGW tools to PATH
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $mingwBin = Join-Path $env:MSYS2_LOCATION "mingw64\bin"
          if (-not (Test-Path $mingwBin)) {
              throw "MinGW toolchain directory not found: $mingwBin"
          }

          $mingwBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify toolchain
        run: |
          gcc --version
          gcov --version
          cmake --version
          ninja --version

      - name: Run strict gate
        run: ./scripts/check.ps1

      - name: Publish deterministic GPU captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valcraft-strict-visual-captures
          if-no-files-found: ignore
          path: |
            cmake-build-strict-*/artifacts/**/*.bmp
            cmake-build-strict-*/artifacts/**/*.json

  backrooms-headless-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned GLM source
        uses: actions/checkout@v4
        with:
          repository: g-truc/glm
          ref: 8d1fd52e5ab5590e2c81768ace50c72bae28f2ed
          path: offline-deps/glm
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout pinned doctest source
        uses: actions/checkout@v4
        with:
          repository: doctest/doctest
          ref: 1da23a3e8119ec5cce4f9388e91b065e20bf06f5
          path: offline-deps/doctest
          fetch-depth: 1
          persist-credentials: false

      - name: Verify headless toolchain
        run: |
          git --version
          cmake --version
          ninja --version

      - name: Configure, build and test without network access
        env:
          GIT_ALLOW_PROTOCOL: file
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          http_proxy: http://127.0.0.1:9
          https_proxy: http://127.0.0.1:9
          all_proxy: http://127.0.0.1:9
        run: |
          cmake -S . -B cmake-build-backrooms-offline -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_DISABLE_FIND_PACKAGE_glm=TRUE \
            -DCMAKE_DISABLE_FIND_PACKAGE_doctest=TRUE \
            -DVALCRAFT_ALLOW_DEPENDENCY_DOWNLOADS=OFF \
            -DVALCRAFT_DEPENDENCY_SOURCE_ROOT="${GITHUB_WORKSPACE}/offline-deps" \
            -DVALCRAFT_HEADLESS_BACKROOMS_TESTS_ONLY=ON

          cmake --build cmake-build-backrooms-offline --target help > headless-targets.txt
          if grep -Eiq "SDL2|glad|FastNoiseLite" headless-targets.txt; then
            echo "A graphics/noise dependency leaked into the headless graph."
            cat headless-targets.txt
            exit 1
          fi

          cmake --build cmake-build-backrooms-offline \
            --target backrooms_core_tests --parallel
          ctest --test-dir cmake-build-backrooms-offline --output-on-failure

          cmake -S . -B cmake-build-backrooms-sanitized -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_DISABLE_FIND_PACKAGE_glm=TRUE \
            -DCMAKE_DISABLE_FIND_PACKAGE_doctest=TRUE \
            -DVALCRAFT_ALLOW_DEPENDENCY_DOWNLOADS=OFF \
            -DVALCRAFT_DEPENDENCY_SOURCE_ROOT="${GITHUB_WORKSPACE}/offline-deps" \
            -DVALCRAFT_HEADLESS_BACKROOMS_TESTS_ONLY=ON \
            -DVALCRAFT_ENABLE_ADDRESS_SANITIZER=ON \
            -DVALCRAFT_ENABLE_UNDEFINED_SANITIZER=ON
          cmake --build cmake-build-backrooms-sanitized \
            --target backrooms_core_tests --parallel
          ctest --test-dir cmake-build-backrooms-sanitized --output-on-failure

          cmake -S . -B cmake-build-backrooms-offline -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_DISABLE_FIND_PACKAGE_glm=TRUE \
            -DCMAKE_DISABLE_FIND_PACKAGE_doctest=TRUE \
            -DVALCRAFT_ALLOW_DEPENDENCY_DOWNLOADS=ON \
            -DVALCRAFT_DEPENDENCY_SOURCE_ROOT="${GITHUB_WORKSPACE}/offline-deps" \
            -DVALCRAFT_HEADLESS_BACKROOMS_TESTS_ONLY=ON
          grep -q "FETCHCONTENT_FULLY_DISCONNECTED:BOOL=OFF" \
            cmake-build-backrooms-offline/CMakeCache.txt
